{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">🛒 Voice Shopping</h1>
            <p class="text-gray-600 mt-2">Sign in to manage your shopping list</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            {% if form.errors %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">Invalid username or password.</div>
            {% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your username" autofocus>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your password">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium py-3 rounded-xl transition">Sign In</button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            <p>Don't have an account? <a href="{% url 'shopping:register' %}" class="text-blue-600 hover:text-blue-800 font-medium">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
